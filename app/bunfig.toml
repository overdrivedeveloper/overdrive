[test]
# Starts a throwaway local Postgres for the database tests when TEST_DATABASE_URL is not set (database tests skip when no
# Postgres binaries are found). Tests live next to their module (src/**) and in test/.
preload = ["./src/testing/preload.ts"]
root = "."

[install]
# Never install a release younger than 7 days (seconds): a hijacked package is usually caught in that window.
minimumReleaseAge = 604800
# New dependencies are saved with an exact version.
exact = true
