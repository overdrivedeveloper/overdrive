[profile.default]
src = "src"
out = "out"
cache_path = "cache"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "ipfs"
cbor_metadata = true
# Fork-test RPC throttle is a CLI flag in forge 1.8 (not a config key): see FORK_FLAGS in scripts/ci-local.sh.
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out" }, { access = "read-write", path = "../app/deployments" }, { access = "read-write", path = "../.audit-grade" }, { access = "read-write", path = "../.batches" }]

[invariant]
runs = 64
depth = 32

[profile.deep.invariant]
runs = 500
depth = 200

[profile.deep.fuzz]
runs = 5000
