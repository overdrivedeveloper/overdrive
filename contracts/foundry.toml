[profile.default]
src = "src"
out = "out"
cache_path = "cache"
libs = ["lib"]
test = "test"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "ipfs"
cbor_metadata = true
# Fork tests share the public RHC RPC, which answers 429 under parallel suites: retry with backoff (rate limit resets
# within 60 s) instead of failing.
fork_retries = 30
fork_retry_backoff = 5000
fs_permissions = [{ access = "read", path = "./" }, { access = "read-write", path = "./out" }, { access = "read-write", path = "../app/deployments" }]

[invariant]
runs = 64
depth = 32

[profile.deep.invariant]
runs = 500
depth = 200

[profile.deep.fuzz]
runs = 5000
