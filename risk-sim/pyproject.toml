[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-sim"
version = "0.1.0"
description = "Nightly stress of the Governor book: replays named scenarios, recommends caps from equity. Recommends only; never changes a cap."
requires-python = ">=3.11"
dependencies = [
  "numpy==2.4.6; python_version < '3.12'",
  "numpy==2.5.3; python_version >= '3.12'",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
risk-sim = "risk_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
