# CI for contracts, services, scripts and repository hygiene. GitHub-hosted runners, no secrets, read-only token.
# Every action is pinned to a full commit SHA (the tag is in the comment); every downloaded tool is pinned to a
# version (gitleaks is also checked against its published SHA-256). .github/scripts/check-hygiene.py enforces the pins.
#
# Every job is skipped on a private repository (a skipped job needs no runner and costs nothing).
# The private-side CI is scripts/ci-local.sh, which runs these same jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.1
  BUN_VERSION: 1.4.4
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.181.0

jobs:
  hygiene:
    name: hygiene (pins, pragmas, README vs deployments, gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependency pins, frozen installs, fixed pragmas, pinned actions
        run: python3 .github/scripts/check-hygiene.py
      - name: README deployment section matches app/deployments
        run: python3 .github/scripts/readme-deployments.py --check
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .github/gitleaks.toml --redact --no-banner

  semgrep:
    name: semgrep
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: semgrep (WARNING and ERROR fail)
        run: bash .github/scripts/semgrep.sh

  contracts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: check_no_failopen_pattern
        run: "! grep -rnE '!= 0\\) .*worse' src/oracle"
      - name: check_privileged_functions
        run: python3 script/ci/privileged-functions.py --check
      - run: forge fmt --check
      - run: forge build
      - name: check_code_size
        run: python3 script/ci/code-size.py out
      # Fork tests skip themselves: there is no secret RPC in CI.
      - run: forge test -vv
        env:
          FOUNDRY_FUZZ_SEED: "0x5eed"

  app:
    name: app (typecheck, unit and database tests)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    # The database tests run against this Postgres. CI=true (set by GitHub) makes the test preload fail, not skip,
    # when no database is reachable, so a green run always includes them.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  guard:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .githooks/public-guard.sh
      - run: bash scripts/guard.test.sh

  scripts:
    name: scripts (exit page, quiet runner, ABI export, server deploy scripts)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: exit page tests
        run: |
          if [ -f exit/test/exit.test.mjs ]; then node --test exit/test/exit.test.mjs; else echo "no exit page in this tree"; fi
      - run: bash scripts/quiet-run.test.sh
      - run: scripts/export-abis.sh
      - run: bash app/scripts/server/deploy-local.test.sh

  python-locks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/check-python-locks.sh
