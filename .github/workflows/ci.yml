# CI for contracts, services, scripts and repository hygiene. GitHub-hosted runners, no secrets, read-only token.
# Every action is pinned to a full commit SHA (the tag is in the comment); every downloaded tool is pinned to a
# version (gitleaks is also checked against its published SHA-256). .github/scripts/check-hygiene.py enforces the pins.
#
# Every job is skipped on a private repository (a skipped job needs no runner and costs nothing).
# The private-side CI is .github/scripts/ci-local.sh, which runs these same jobs.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Nothing on main is ever cancelled: each run on main has its own group (commit and run id), so neither a newer push
# nor a manual re-run of the same commit (the launch proof is one push run plus two workflow_dispatch runs) cancels it.
# A cancelled run reads as broken on the public Actions page, and public runners are free. Pull requests still cancel
# superseded runs.
concurrency:
  group: ci-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.sha, github.run_id) || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FOUNDRY_VERSION: v1.8.4
  BUN_VERSION: 1.4.4
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  SEMGREP_VERSION: 1.181.0
  SLITHER_VERSION: 0.11.6
  NODE_VERSION: 26.13.0
  PYTHON_VERSION: "3.12.14"

jobs:
  # Sets contracts=true when this push changed contracts/ or this workflow. The full via-ir build of every contract and
  # test is the slowest step, and most pushes touch only app/, web/ or sdk/. Pull requests, manual runs, a branch's first
  # push and a push whose previous tip is gone (a rewritten branch) always run the contract job.
  changes:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.diff.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          contracts=true
          if [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            if [ -z "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- contracts .github/workflows/ci.yml)" ]; then contracts=false; fi
          fi
          echo "contracts=$contracts"
          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"

  hygiene:
    name: hygiene (pins, pragmas, README vs deployments, gitleaks)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Dependency pins, frozen installs, fixed pragmas, pinned actions
        run: python3 .github/scripts/check-hygiene.py
      - name: README deployment section matches app/deployments
        run: python3 .github/scripts/readme-deployments.py --check
      - name: gitleaks (full history)
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git . --config .github/gitleaks.toml --redact --no-banner

  semgrep:
    name: semgrep
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: python -m pip install --disable-pip-version-check "semgrep==${SEMGREP_VERSION}"
      - name: semgrep (WARNING and ERROR fail)
        run: bash .github/scripts/semgrep.sh

  contracts:
    needs: changes
    if: ${{ !github.event.repository.private && needs.changes.outputs.contracts == 'true' }}
    runs-on: ubuntu-24.04
    # A cold via-ir build of every contract and test is the slow path (well over 30 min on a 4-core runner); a cached
    # build recompiles only what changed. The limit is for a hung job, not for the cold build.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      # forge's cache is keyed on file content, so a restored out/ + cache/ from an earlier commit recompiles only what
      # changed. Restore and save are separate steps: the build is saved as soon as it succeeds, even when a later
      # check or test fails, so one red run never forces the next run back onto the cold build.
      - id: forge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('contracts/foundry.toml', 'contracts/src/**', 'contracts/test/**', 'contracts/script/**', 'contracts/lib/**') }}
          restore-keys: |
            forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-
      # The cold build's earlier kills (exit 143 "runner has received a shutdown signal" at 11 to 18 min, "lost
      # communication ... starves it for CPU/Memory" at 57 min) are the signature of a hosted VM running out of memory
      # under one long via-ir solc process. 16 GB of extra swap turns memory pressure into a slower build instead of a
      # killed VM; the monitor prints memory and swap every minute, so a kill that still happens names its cause.
      - name: Add swap for the via-ir build
        working-directory: .
        run: |
          sudo fallocate -l 16G /mnt/forge.swap
          sudo chmod 600 /mnt/forge.swap
          sudo mkswap /mnt/forge.swap
          sudo swapon /mnt/forge.swap
          free -m
      - name: check_no_failopen_pattern
        run: "! grep -rnE '!= 0\\) .*worse' src/oracle"
      - name: check_privileged_functions
        run: python3 script/ci/privileged-functions.py --check
      - name: check_audit_scope
        run: python3 script/ci/audit-scope.py --check
      - name: check_natspec
        run: python3 script/ci/natspec.py --self-test && python3 script/ci/natspec.py --check
      - name: check_slither_exceptions
        run: python3 script/ci/slither-exceptions.py --check
      - name: check_roles_table
        run: python3 script/ci/roles-table.py --check
      - run: forge fmt --check
      - name: forge build (memory and swap logged every minute)
        run: |
          ( while sleep 60; do free -m | awk -v t="$SECONDS" '/^Mem:/{m=$3"/"$2} /^Swap:/{print "build t=" t "s mem used " m " MB, swap used " $3 "/" $2 " MB"}'; done ) &
          monitor=$!
          rc=0
          forge build || rc=$?
          kill "$monitor"
          free -m
          exit "$rc"
      - if: ${{ steps.forge-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}
      - name: check_code_size
        run: python3 script/ci/code-size.py out
      # Fork tests skip themselves: there is no secret RPC in CI. Where one is set (ci-local) they fork the pinned
      # block in test/utils/ForkPin.sol, never the latest block.
      - run: forge test -vv
        env:
          FOUNDRY_FUZZ_SEED: "0x5eed"

  app:
    name: app (typecheck, unit and database tests)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The database tests run against this Postgres. CI=true (set by GitHub) makes the test preload fail, not skip,
    # when no database is reachable, so a green run always includes them.
    services:
      postgres:
        image: postgres:16.10-bookworm@sha256:38471f330eb885e04de130b768d6db4e10469e2311879c7e5c699f6d2d8a1c74 # multi-arch index digest, resolved 2026-11-16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  slither:
    name: slither (contracts, triaged config)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install slither
        run: python -m pip install --disable-pip-version-check "slither-analyzer==${SLITHER_VERSION}"
      - name: slither (any result not in slither.db.json fails)
        run: bash ../.github/scripts/slither.sh

  guard:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The word denylist is private by design: the public sync excludes .githooks/public-guard.denylist from every
      # public copy, and the guard refuses to run without it (it never skips
      # silently). The word check is enforced before anything is published: the private pre-commit hook,
      # .github/scripts/ci-local.sh (job_guard, unchanged) and the pre-push hook, which accepts a public copy only when its tree is
      # the private tree minus the denylist. A tree without the denylist (the public copy) skips these two steps with a
      # notice that says so; a tree with it runs them.
      - name: public guard (word denylist, private trees only)
        run: |
          if [ -f .githooks/public-guard.denylist ]; then
            .githooks/public-guard.sh
            bash .github/scripts/guard.test.sh
          else
            echo "::notice title=public guard skipped::the word denylist is private and excluded from this public copy; the private pre-commit, ci-local and pre-push gates ran the guard before it was published"
          fi
      - run: bash .github/scripts/pre-push.test.sh

  scripts:
    name: scripts (exit page, quiet runner, ABI export, server deploy scripts)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: exit page tests
        run: |
          if [ -f web/exit/test/exit.test.mjs ]; then node --test web/exit/test/exit.test.mjs; else echo "no exit page in this tree"; fi
      - run: bash .github/scripts/quiet-run.test.sh
      - run: .github/scripts/export-abis.sh
      - run: bash app/scripts/server/deploy-local.test.sh
      - run: bash contracts/script/ci/sourcify-verify.test.sh

  web:
    name: web (typecheck, build, tests)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run build
      - run: bun test

  sdk:
    name: sdk (generate:check, tests, typecheck)
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run generate:check
      - run: bun test
      - run: bunx tsc --noEmit -p tsconfig.json

  python-locks:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/check-python-locks.sh
