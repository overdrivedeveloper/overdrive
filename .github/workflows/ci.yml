name: ci

# Every job is skipped on a private repository (a skipped job needs no runner and costs nothing).
# The private-side CI is scripts/ci-local.sh, which runs these same jobs.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: check_no_failopen_pattern
        run: "! grep -rnE '!= 0\\) .*worse' src/oracle"
      - run: forge fmt --check
      - run: forge build
      # Fork tests skip themselves: there is no secret RPC in CI.
      - run: forge test -vv
        env:
          FOUNDRY_FUZZ_SEED: "0x5eed"

  app:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit

  guard:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .githooks/public-guard.sh
      - run: bash scripts/guard.test.sh
