# Publishes sdk/ (package `ovrd`) to npm with provenance. Manual only (Actions tab, "npm publish", Run workflow, branch main)
# and only in the PUBLIC repository. First publish needs the NPM_TOKEN secret (a short granular token the owner makes);
# once trusted publishing is configured on npmjs.com the secret is deleted and the same step publishes through OIDC.
name: npm publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # provenance, and trusted publishing (OIDC)

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.repository.private && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # trusted publishing needs Node >= 22.14
          registry-url: "https://registry.npmjs.org"
      - name: npm new enough for trusted publishing (>= 11.5.1)
        run: npm install -g "npm@^11.5.1" && npm --version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install dependencies (frozen lockfile)
        working-directory: sdk
        run: bun install --frozen-lockfile
      - name: Generated files are current, types check, tests pass
        working-directory: sdk
        run: bun run generate:check && bun run typecheck && bun test
      - name: Build, pack and run the tarball under plain Node (stub API, no network)
        working-directory: sdk
        run: bun run build && node scripts/smoke.mjs
      - name: This version is not on npm yet
        working-directory: sdk
        run: |
          name=$(node -p "require('./package.json').name"); version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: bump package.json, then run this again." >&2; exit 1
          fi
      - name: Publish with provenance
        working-directory: sdk
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then echo "Publishing with the NPM_TOKEN secret (first publish). Delete it once trusted publishing works."; else echo "No NPM_TOKEN secret: publishing through trusted publishing (OIDC)."; fi
          npm publish --provenance --access public
